<!DOCTYPE html>
<html lang="en">
<head>  <link rel="preconnect" href="https://fonts.googleapis.com">
    <script defer  src="script.js"></script>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto calentamiento</title>
</head>
<body>
    <h1 id="title">Bienvenidos a Proyecto calentamiento</h1>
    <form action="" style="width:200px;gap: 6px; display: flex; flex-direction: column;">
       <h2>Formulario de registro</h2>

        <label class="tarjeta" for="nombre">Nombre:</label>
        <input class="campo" type="text" id="nombre" name="nombre"
               placeholder="Escribe tu nombre" required>

        <label class="tarjeta" for="correo">Correo electrónico:</label>
        <input class="campo" type="email" id="correo" name="correo"
               placeholder="ejemplo@gmail.com" required>
                 <button id="boton" type="submit">Enviar formulario</button>
    </form>
    <style>
  body  {
    font-family: 'Roboto', sans-serif;
  
  }
</style>
</body>
</html>
